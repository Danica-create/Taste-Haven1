<h2><img src="images/contact.png" width="2%">Contact Information</h2>

<label>First Name</label>
<input type="text" id="name">
<span id="nameError" class="error"></span>

<label>Phone Number</label>
<input type="tel" id="number">
<span id="numberError" class="error"></span>

<label>Email (Optional)</label>
<input type="email" id="email">
<span id="emailError" class="error"></span>


<h2> <img src="images/Delivery.png" width="2%">Delivery Address</h2>

<label>Street Address</label>
<textarea id="address"></textarea>
<span id="addressError" class="error"></span>

<label>City</label>
<input type="text" id="city">
<span id="cityError" class="error"></span>

<label>State</label>
<input type="text" id="state">
<span id="stateError" class="error"></span>

<label>Landmark (Optional)</label>
<input type="text" id="landmark">


<h2> <img src="images/Adress.png"  width="2%">Delivery Method</h2>

<div class="delivery-method">

    <div class="option">
        <input type="radio" id="delivery" name="deliveryMethod" value="Delivery">
        <label for="delivery">
            <strong>Delivery</strong><br>
            We'll deliver your order to your address.
        </label>
    </div>

    <div class="option">
        <input type="radio" id="pickup" name="deliveryMethod" value="Pickup">
        <label for="pickup">
            <strong>Pickup</strong><br>
            Pick up your order from our restaurant.
        </label>
    </div>

</div>
