<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Taste Haven</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body class="auth-page login-page">

    <div class="auth-card">

        <h1>Log in</h1>

        <form id="loginForm">

            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    required
                >
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="loginPassword">Password</label>
                    <button type="button" class="toggle-password" data-target="loginPassword">Show</button>
                </div>
                <input
                    type="password"
                    id="loginPassword"
                    required
                >
            </div>

            <div class="action-row">
            
                <button type="submit" class="btn-primary">Log in</button>
                
                <p class="switch-text">Don't have an account? <a href="signup.html">Sign up</a></p>
            </div>

            <p class="forgot-link"><a href="#">Forgotten password</a></p>

        </form>

    </div>

    <script src="script1.js"></script>
</body>
</html>
